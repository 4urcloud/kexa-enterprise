#cloud-config

hostname: kexa
fqdn: kexa.example.com
manage_etc_hosts: true

users:
  - name: admnkexa
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-rsa CHANGEME

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - ufw
  - fail2ban
  - git
  - jq

runcmd:
  # Docker installation
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker admnkexa

  # Firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # Fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Clone repository and setup
  - su - admnkexa -c "git clone git@github.com:4urcloud/kexa-enterprise.git /home/admnkexa/kexa-enterprise"
  - su - admnkexa -c "cd /home/admnkexa/kexa-enterprise/docker-compose && cp .env-sample .env"

  # Generate self-signed certificates
  - openssl req -x509 -nodes -days 650 -newkey rsa:2048 -subj "/CN=kexa" -keyout /home/admnkexa/kexa-enterprise/docker-compose/keycloak-scripts/certs/server.key -out /home/admnkexa/kexa-enterprise/docker-compose/keycloak-scripts/certs/server.crt
  - openssl req -x509 -nodes -days 650 -newkey rsa:2048 -subj "/CN=kexa" -keyout /home/admnkexa/kexa-enterprise/docker-compose/nginx-scripts/certs/nginx.key -out /home/admnkexa/kexa-enterprise/docker-compose/nginx-scripts/certs/nginx.crt
  - chown -R admnkexa:admnkexa /home/admnkexa/kexa-enterprise

write_files:
  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = 22
      filter = sshd
      maxretry = 3
      bantime = 3600
      findtime = 600
