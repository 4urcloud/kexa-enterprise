name: cronicle-image

# Builds and publishes the kexa/kexa-cronicle Docker image from the public
# kexa-io/cronicle-for-kexa repository. The workflow lives in this 4urcloud
# repository so the Docker Hub credentials (4urcloud org secrets) never have
# to be shared with the kexa-io organization.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref of kexa-io/cronicle-for-kexa to build (tag, branch or SHA)"
        required: true
        default: "main"
      publish_latest:
        description: "Also update the latest tag"
        type: boolean
        default: true
  schedule:
    # Weekly rebuild of main to pick up base image security updates.
    - cron: "0 6 * * 1"

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cronicle-for-kexa
        uses: actions/checkout@v4
        with:
          repository: kexa-io/cronicle-for-kexa
          ref: ${{ inputs.ref || 'main' }}

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_NAME_KEXA }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME_KEXA }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD_KEXA }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: tags
        run: |
          REF="${{ inputs.ref || 'main' }}"
          TAGS=""
          case "$REF" in
            v[0-9]*) TAGS="kexa/kexa-cronicle:$REF" ;;
          esac
          if [ "${{ inputs.publish_latest }}" != "false" ]; then
            TAGS="${TAGS:+$TAGS,}kexa/kexa-cronicle:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Publishing tags: $TAGS"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.saas
          push: true
          tags: ${{ steps.tags.outputs.tags }}
